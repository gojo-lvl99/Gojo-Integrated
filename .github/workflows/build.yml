name: Build and Push — ⚡ GOJO I/O

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate config.json
        run: |
          python3 -m json.tool config.json > /dev/null && echo "✅ config.json valid"

      - name: Test Docker Build
        run: |
          docker build -t gojo-io-test . && echo "✅ Build OK"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gojo-integrated-io:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gojo-integrated-io:${{ github.sha }}
