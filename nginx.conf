events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream vless_ws  { server 127.0.0.1:10001; keepalive 32; }
    upstream vless_hu  { server 127.0.0.1:10002; keepalive 32; }
    upstream vmess_ws  { server 127.0.0.1:10003; keepalive 32; }
    upstream vmess_hu  { server 127.0.0.1:10004; keepalive 32; }
    upstream trojan_ws { server 127.0.0.1:10005; keepalive 32; }
    upstream trojan_hu { server 127.0.0.1:10006; keepalive 32; }
    upstream ss_ws     { server 127.0.0.1:10007; keepalive 32; }
    upstream ss_hu     { server 127.0.0.1:10008; keepalive 32; }

    limit_conn_zone $server_name zone=srv:10m;

    server {
        listen 8080;
        limit_conn srv MAX_CONN_HERE;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        root /usr/share/nginx/html;

        location = / {
            try_files $uri /index.html =404;
        }

        location = /status.json {
            alias /tmp/status.json;
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
        }

        location /gojo/vless-ws {
            proxy_pass http://vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        location /gojo/vless-hu {
            proxy_pass http://vless_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /gojo/vmess-ws {
            proxy_pass http://vmess_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        location /gojo/vmess-hu {
            proxy_pass http://vmess_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /gojo/trojan-ws {
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        location /gojo/trojan-hu {
            proxy_pass http://trojan_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /gojo/ss-ws {
            proxy_pass http://ss_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        location /gojo/ss-hu {
            proxy_pass http://ss_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
