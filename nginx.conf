worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    tcp_nopush   on;
    tcp_nodelay  on;
    keepalive_timeout 86400;

    # Connection upgrade map — auto WS vs HU
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_conn_zone $server_name zone=srv:10m;

    server {
        listen 8080;
        limit_conn srv MAX_CONN_HERE;

        # ── Status endpoint ──────────────────────────
        location = /status.json {
            alias /tmp/status.json;
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
        }

        # ── Static files ─────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── VLESS WebSocket ──────────────────────────
        location ~ ^/gojo/vless-ws/ {
            proxy_pass         http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── VLESS HTTPUpgrade ────────────────────────
        location ~ ^/gojo/vless-hu/ {
            proxy_pass         http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── VMess WebSocket ──────────────────────────
        location ~ ^/gojo/vmess-ws/ {
            proxy_pass         http://127.0.0.1:10003;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── VMess HTTPUpgrade ────────────────────────
        location ~ ^/gojo/vmess-hu/ {
            proxy_pass         http://127.0.0.1:10004;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── Trojan WebSocket ─────────────────────────
        location ~ ^/gojo/trojan-ws/ {
            proxy_pass         http://127.0.0.1:10005;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── Trojan HTTPUpgrade ───────────────────────
        location ~ ^/gojo/trojan-hu/ {
            proxy_pass         http://127.0.0.1:10006;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── Shadowsocks WebSocket ────────────────────
        location ~ ^/gojo/ss-ws/ {
            proxy_pass         http://127.0.0.1:10007;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }

        # ── Shadowsocks HTTPUpgrade ──────────────────
        location ~ ^/gojo/ss-hu/ {
            proxy_pass         http://127.0.0.1:10008;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering            off;
            proxy_request_buffering    off;
        }
    }
}
